<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Server Status</title>
    <script src="https://www.steamwidgets.net/api/resource/query?type=js&module=server-status&version=v1"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #121212;
            color: #fff;
        }
        .server {
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #1e1e1e;
        }
        h1 {
            text-align: center;
        }
        .server h2 {
            margin: 0 0 10px;
        }
        .server-status {
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Game Server Status</h1>

    <!-- 7 Days to Die -->
    <div class="server">
        <h2>7 Days to Die</h2>
        <div id="server-7dtd" class="server-status"></div>
    </div>

    <!-- ARK: Survival Evolved -->
    <div class="server">
        <h2>ARK: Survival Evolved</h2>
        <div id="server-ark" class="server-status"></div>
    </div>

    <!-- Palworld -->
    <div class="server">
        <h2>Palworld</h2>
        <div id="server-palworld" class="server-status"></div>
    </div>

    <script>
        // Initialize widgets for each server
        SteamWidgets.init({
            element: '#server-7dtd',
            server: {
                ip: '208.191.79.30',
                port: 26900,
            },
            theme: 'dark',
        });

        SteamWidgets.init({
            element: '#server-ark',
            server: {
                ip: '208.191.79.30',
                port: 27016,
            },
            theme: 'dark',
        });

        SteamWidgets.init({
            element: '#server-palworld',
            server: {
                ip: '208.191.79.30',
                port: 27015,
            },
            theme: 'dark',
        });
    </script>
</body>
</html>
