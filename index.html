<head>

    <title>Game Server Status</title>
    <script src="https://www.steamwidgets.net/api/resource/query?type=js&module=steam-server&version=v1"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #121212;
            color: #fff;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .server {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Game Server Status</h1>

    <!-- 7 Days to Die -->
    <div class="server">
        <h2>7 Days to Die</h2>
        <steam-server addr="208.191.79.30:26900"></steam-server>
    </div>

    <!-- ARK: Survival Evolved -->
    <div class="server">
        <h2>ARK: Survival Evolved</h2>
        <steam-server addr="208.191.79.30:27016"></steam-server>

    <!-- Palworld -->
    <div class="server">

        <steam-server addr="208.191.79.30:27015"></steam-server>

</html>
